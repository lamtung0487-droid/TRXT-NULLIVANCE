# =============================================================================
# TRXT VALIDATION - MASTER RUN CONFIGURATION
# =============================================================================
# This file is auto-populated with run metadata at execution time.
# Fixed parameters are defined here; dynamic ones are filled by scripts.

# =============================================================================
# RUN METADATA (auto-filled)
# =============================================================================
run_id: "<auto-generated UUID>"
commit_hash: "<auto-filled by script>"
timestamp: "<auto-filled>"
hostname: "<auto-filled>"

# =============================================================================
# REPRODUCIBILITY
# =============================================================================
reproducibility:
  random_seed: 42
  prng_backend: "numpy"
  deterministic_mode: true

# =============================================================================
# PHYSICS CONSTANTS (from CODATA 2022 / PDG 2024)
# =============================================================================
physics:
  # Master Scale (derived from tau mass and fine structure constant)
  M_star: 365.2407  # GeV
  M_star_source: "CODATA 2022: m_tau * (3 / 2*alpha)"
  
  # Fine structure constant
  alpha: 0.0072973525693
  alpha_source: "CODATA 2022"
  
  # Tau lepton mass
  m_tau: 1.77686  # GeV
  m_tau_source: "PDG 2024"
  
  # Gravitational constant
  G_Newton: 6.67430e-11  # m³ kg⁻¹ s⁻²
  G_source: "CODATA 2022"

# =============================================================================
# SPARC VALIDATION SETTINGS
# =============================================================================
sparc:
  # Data split (STRICT 60/20/20)
  train_fraction: 0.60
  val_fraction: 0.20
  test_fraction: 0.20
  
  # Test set handling
  test_galaxies_sealed: true
  seal_log_file: "outputs/test_set_seal.log"
  
  # Cross-validation
  k_fold: 5
  cv_stratify_by: "morphology"
  
  # Success thresholds
  chi2_threshold: 5.0
  chi2_threshold_strict: 2.0
  
  # Solver settings
  n_initial_guess: 1.5
  n_bounds: [0.5, 3.0]
  
  # Bootstrap
  n_bootstrap: 1000

# =============================================================================
# SIDM CROSS-SECTION SETTINGS
# =============================================================================
sidm:
  # Velocity benchmarks
  v_dwarf: 30       # km/s (dwarf galaxy scale)
  v_mw: 200         # km/s (Milky Way scale)
  v_cluster: 1000   # km/s (cluster scale)
  
  # Model parameters
  alpha_chi: 0.01   # DM-phonon coupling
  m_phi: 30         # MeV (phonon mediator mass)
  m_chi: 5.70       # GeV (DT-1 mass)
  
  # Numerov solver
  r_max: 100        # fm
  n_points: 10000
  l_max: 50         # partial waves

# =============================================================================
# SOLVER SETTINGS
# =============================================================================
solver:
  rtol: 1.0e-8
  atol: 1.0e-10
  max_steps: 10000
  method: "RK45"

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================
output:
  base_dir: "outputs/runs"
  save_intermediate: true
  save_plots: true
  plot_format: "png"
  plot_dpi: 300
